<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 - كلمة السر</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="sway.mp3" type="audio/mpeg">
</audio>
<button class="music-btn" id="musicBtn" title="تشغيل / إيقاف">🎵</button>

<div class="container">
  <div class="emoji">🔐</div>
  <div class="message">اكتبي كلمة السر عشان تفوتي 💕</div>

  <input type="password" id="passwordInput" placeholder="كلمة السر..."
         style="margin:20px 0; padding:15px 20px; font-size:1.2rem; border-radius:15px; border:2px solid #ff6b9d; outline:none; text-align:center; width:100%; font-family:inherit;">

  <button onclick="checkPassword()">دخول 💌</button>

  <div class="note">
   (3182025) ملاحظة: كلمة السر هي <strong>التاريخ اللي عرفنا بعض فيه</strong> 💕
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
